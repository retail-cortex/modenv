name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'coverage.svg'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'coverage.svg'

jobs:
  test-and-build:
    name: Polyglot Test and Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'clients/typescript/pnpm-lock.yaml'

      - name: Install TypeScript Dependencies
        run: |
          cd clients/typescript
          pnpm install --frozen-lockfile

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('**/MODULE.bazel', '**/BUILD.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Run All Polyglot Tests & Coverage with Bazel
        run: bazel coverage //...

      - name: Generate Coverage Badge
        if: github.ref == 'refs/heads/main'
        uses: retail-cortex/lcov-coverage-badge@main
        with:
          file: bazel-out/_coverage/_coverage_report.dat
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build All Monorepo Targets with Bazel
        run: bazel build //...

      - name: Cross-Compile Go CLI for Multiple Target Platforms
        run: |
          mkdir -p dist/binaries
          
          # Linux AMD64
          bazel build --platforms=@rules_go//go/toolchain:linux_amd64 //cmd/cli
          cp bazel-bin/cmd/cli/cli_/cli dist/binaries/modenv-linux-amd64
          
          # Linux ARM64
          bazel build --platforms=@rules_go//go/toolchain:linux_arm64 //cmd/cli
          cp bazel-bin/cmd/cli/cli_/cli dist/binaries/modenv-linux-arm64
          
          # Darwin (macOS) Apple Silicon
          bazel build --platforms=@rules_go//go/toolchain:darwin_arm64 //cmd/cli
          cp bazel-bin/cmd/cli/cli_/cli dist/binaries/modenv-darwin-arm64
          
          # Darwin (macOS) Intel
          bazel build --platforms=@rules_go//go/toolchain:darwin_amd64 //cmd/cli
          cp bazel-bin/cmd/cli/cli_/cli dist/binaries/modenv-darwin-amd64
          
          # Windows AMD64
          bazel build --platforms=@rules_go//go/toolchain:windows_amd64 //cmd/cli
          cp bazel-bin/cmd/cli/cli_/cli.exe dist/binaries/modenv-windows-amd64.exe

          ls -la dist/binaries/

      - name: Upload Compiled CLI Binaries
        uses: actions/upload-artifact@v4
        with:
          name: modenv-cli-binaries
          path: dist/binaries/
          retention-days: 7

  docs:
    name: Build & Validate Documentation
    runs-on: ubuntu-latest
    needs: [test-and-build]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-docs-${{ hashFiles('**/MODULE.bazel', '**/BUILD.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-docs-

      - name: Validate Hugo Site via Bazel
        run: bazel test //docs:site_test

      - name: Build Hugo Site Output
        run: |
          bazel build //docs:site
          mkdir -p _site
          cp -rL bazel-bin/docs/site/. _site/
          chmod -R u+w _site
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

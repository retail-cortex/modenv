[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modenv"
version = "0.0.1"
description = "Hierarchical TOML configuration and environment loader"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ryan McGuinness" },
]
dependencies = [
    "tomli-w>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
